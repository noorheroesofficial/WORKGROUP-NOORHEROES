<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NoorHeroes · Authentication review</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth-v2.css"></head>
<body>
<aside class="review" aria-label="Prototype review controls"><strong>Authentication review</strong><span>Local companion · simulated authentication</span><div><button data-view="login">Login</button><button data-view="registration">Registration</button><button data-view="language">Language</button><select id="scenario" aria-label="Controlled mock HTTP scenario"><option value="success">HTTP 200 · Success</option><option value="422">HTTP 422 · Field error</option><option value="422-global">HTTP 422 · General error</option><option value="500">HTTP 500 · Server failure</option><option value="503">HTTP 503 · Unavailable</option><option value="429">HTTP 429 · Rate limit (3 seconds)</option><option value="401">HTTP 401 · Authentication failure</option><option value="403">HTTP 403 · Request rejected</option><option value="network">Network failure</option><option value="timeout">Timeout (3 seconds)</option></select><select id="text-scale" aria-label="Text scale"><option value="16">Text 100%</option><option value="32">Text 200%</option></select><button id="direction" aria-pressed="false">RTL layout check</button><button id="reduce-motion" aria-pressed="false">Reduced motion</button></div><p id="review-result" role="status">Fictional review data only. Requests use the local mock server.</p></aside>
<main class="phone" id="app">
<section id="login" aria-labelledby="login-title">
<button class="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m12 5-7 7 7 7M5 12h14"/></svg></button>
<img class="toolbar-wordmark" src="wordmark-approved.png" alt="NoorHeroes"><div class="brand"><img src="monogram.png" alt=""></div>
<div class="panel"><header><h1 id="login-title">Log In</h1><p>Use your phone number or email to log in.</p></header>
<form id="auth-form" novalidate>
<div class="tabs" role="tablist" aria-label="Login method"><button type="button" role="tab" aria-selected="true" data-method="phone" aria-controls="phone-group">Phone</button><button type="button" role="tab" aria-selected="false" data-method="email" aria-controls="email-group">Email</button></div>
<div id="phone-group" role="tabpanel"><label for="phone-input">Phone number</label><div class="field"><button id="country-open" type="button" aria-haspopup="dialog" aria-label="Country code: United States +1"><img id="country-flag" src="flags/US.png" alt=""><span id="country-code">+1</span><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></button><input id="phone-input" autocomplete="tel-national" inputmode="tel" type="tel" placeholder="Phone number" aria-describedby="validation"></div></div>
<div id="email-group" role="tabpanel" hidden><label for="email-input">Email address</label><div class="field"><input id="email-input" autocomplete="email" inputmode="email" type="email" placeholder="Email address" aria-describedby="validation"></div></div>
<p id="validation" role="alert" hidden></p>
<div class="consent" hidden><div class="consent-line"><input id="consent-check" type="checkbox" aria-label="Review required consents"><span>I accept <button id="terms-open" type="button">Terms and Conditions</button> and <button id="privacy-open" type="button">Privacy Policy</button></span></div></div><button class="optional" type="button"><span>Optional preferences</span><span aria-hidden="true">›</span></button><div class="submit-space"><button id="submit" class="primary" type="submit"><span class="button-label">Send code <svg viewBox="0 0 24 24"><path d="m12 5 7 7-7 7M5 12h14"/></svg></span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></button></div><p class="sr-only" id="processing-status" role="status"></p>
</form>
<div class="separator"><span>or continue with</span></div>
<button id="google" class="google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6C44.4 38.02 46.98 31.87 46.98 24.55Z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.12.78-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19Z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/></svg><span class="button-label">Continue with Google</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></button>
</div><footer><span id="account-copy"></span> <button id="account-link" class="footer-link"></button></footer>
</section>
<section id="language" hidden aria-labelledby="language-title"><header><div class="language-top"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><img src="monogram.png" alt="NoorHeroes"></div><h1 id="language-title">Choose your language</h1><p>Select the language for your experience</p></header><div id="languages"></div><div class="language-footer"><button class="primary" id="language-continue">Continue</button></div></section>
</main>
<dialog id="country-dialog" aria-labelledby="country-title"><div class="sheet"><div class="handle"></div><div class="sheet-heading"><h2 id="country-title">Country code</h2><button id="country-close" class="icon-button" aria-label="Close country selector"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><div class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="country-search" type="search" placeholder="Search" aria-label="Search country name or dialing code" autocomplete="off"><button id="search-clear" class="icon-button" aria-label="Clear search" hidden>×</button></div><p id="result-count" class="sr-only" role="status"></p><div id="country-list" role="radiogroup" aria-label="Countries"></div></div></dialog>
<div id="snackbar" role="alert" hidden><span id="snack-text"></span><button id="retry">Retry</button><button id="snack-close" aria-label="Dismiss notification">×</button></div>
<dialog id="legal-dialog" aria-labelledby="legal-title"><div class="sheet"><div class="handle"></div><div class="sheet-heading"><h2 id="legal-title"></h2><button id="legal-close" class="icon-button" aria-label="Close document">×</button></div><div id="legal-content"></div><button id="legal-agree" class="primary"></button></div></dialog>
<script src="countries.js"></script><script src="vendor/libphonenumber-max.js"></script><script src="vendor/validator.min.js"></script><script src="auth-core.cjs"></script><script src="snackbar-core.cjs"></script><script src="app-v2.js"></script></body></html>
